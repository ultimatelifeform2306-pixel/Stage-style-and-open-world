<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Sewi Demo Story</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one wide 16:9 black screen. Itachi's lines run as movie subtitles at the bottom,
   then a stepped fade and the ACT 1 card in the same black. */
:root {
  --void: #000000;
  --sub: #f4f1ff;        /* subtitle white */
  --sub-edge: #000000;
  --muted: #7d7a99;
  --gold: #ffd25a;       /* ACT title */
  --ember: #8a1408;
  --flame: #e8301c;
  --font-pixel: "Press Start 2P", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--sub);
  font-family: var(--font-pixel);
  display: grid;
  place-items: center;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative;
  width: min(100%, calc((100dvh - 24px) * 16 / 9));
  max-width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  background: var(--void);
  overflow: hidden;
  cursor: pointer;
}

/* movie subtitle */
#sub {
  position: absolute;
  left: 6%; right: 6%; bottom: 9%;
  margin: 0;
  text-align: center;
  font-size: 2.3cqw;
  line-height: 1.8;
  min-height: 1.8em;
  color: var(--sub);
  text-shadow:
    0.25cqw 0 0 var(--sub-edge), -0.25cqw 0 0 var(--sub-edge),
    0 0.25cqw 0 var(--sub-edge), 0 -0.25cqw 0 var(--sub-edge),
    0.3cqw 0.3cqw 0 var(--sub-edge);
  overflow-wrap: anywhere;
}
#sub .name { color: var(--gold); }

.hint {
  position: absolute; left: 0; right: 0;
  text-align: center;
  font-size: 1.4cqw;
  color: var(--muted);
}
#start { top: 50%; transform: translateY(-50%); font-size: 2cqw; color: var(--sub); animation: blink 1s steps(2) infinite; }
#prompt { bottom: 3%; display: flex; flex-direction: column; align-items: center; gap: 1cqw; }
#prompt span { animation: blink 1s steps(2) infinite; }
#timer { width: 18cqw; height: 0.8cqw; background: #1a1a1a; }
#timer-fill { height: 100%; width: 100%; background: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }

/* ACT card */
#fade { position: absolute; inset: 0; background: var(--void); opacity: 0; pointer-events: none; }
#fade.on { animation: fade-out 900ms steps(5) forwards; }
@keyframes fade-out { to { opacity: 1; } }
#act {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3.5cqw;
  background: var(--void);
}
#act-title {
  margin: 0;
  font-size: 9cqw;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: 0.12em;
  text-shadow: 0.7cqw 0.7cqw 0 var(--ember);
  display: flex;
}
#act-title .ch { display: inline-block; min-width: 0.6em; opacity: 0; }
#act-title .ch.in { animation: drop 360ms steps(4) forwards; }
@keyframes drop { from { opacity: 1; transform: translateY(-3cqw); } to { opacity: 1; transform: none; } }
#act-rule { height: 0.6cqw; width: 0; background: var(--flame); box-shadow: 0 0.6cqw 0 var(--ember); transition: width 700ms steps(14); }
#act-rule.in { width: 40cqw; }
#replay { position: static; opacity: 0; transition: opacity 400ms steps(3); }
#replay.in { opacity: 1; }

/* ---- ACT 1 scenes ---- */
#scene { position: absolute; inset: 0; background: var(--void); overflow: hidden; }
#sc-img, #sc-vid, #sc-px { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
#sc-px { image-rendering: pixelated; image-rendering: crisp-edges; }
#sc-img.shake { animation: rumble 120ms steps(2) infinite, jolt 700ms steps(7) 1; }
@keyframes rumble {
  0% { transform: scale(1.06) translate(0.35%, -0.25%); }
  50% { transform: scale(1.06) translate(-0.35%, 0.3%); }
  100% { transform: scale(1.06) translate(0.2%, 0.35%); }
}
@keyframes jolt { 0% { filter: brightness(2.2); } 100% { filter: none; } }
#sc-img.pan { object-position: 50% 0%; animation: pan 14s linear forwards; }
@keyframes pan { to { object-position: 50% 78%; } }
#date {
  position: absolute; left: 0; right: 0; top: 42%;
  text-align: center;
  font-size: 2.6cqw;
  color: var(--gold);
  text-shadow: 0.3cqw 0.3cqw 0 var(--ember);
  letter-spacing: 0.06em;
}
#date.caret::after { content: "_"; animation: blink 0.6s steps(2) infinite; }
#sub.waiting { animation: tap-me 1.4s steps(3) infinite; }
@keyframes tap-me { 50% { opacity: 0.45; } }
#cut { position: absolute; inset: 0; background: var(--void); opacity: 0; pointer-events: none; }
#end-title { margin: 0; font-size: 4cqw; font-weight: 400; color: var(--gold); text-shadow: 0.5cqw 0.5cqw 0 var(--ember); }

@media (prefers-reduced-motion: reduce) {
  #sc-img.shake, #sc-img.pan, #sub.waiting { animation: none; }
  #start, #prompt span, #act-title .ch.in { animation: none; }
  #act-title .ch.in { opacity: 1; }
  #fade.on { animation-duration: 1ms; }
}
</style>
</head>
<body>
<div id="stage" role="application" aria-label="Demo story. Click or press Space to continue.">
  <div id="scene" hidden>
    <img id="sc-img" alt="" hidden>
    <video id="sc-vid" playsinline preload="auto" hidden></video>
    <canvas id="sc-px" width="256" height="144" hidden></canvas>
    <div id="date" aria-live="polite"></div>
  </div>
  <div id="cut"></div>
  <p id="sub" aria-live="polite"></p>
  <div id="start" class="hint" hidden>&#9654; TAP TO START</div>
  <div id="prompt" class="hint" hidden>
    <span>CLICK TO CONTINUE</span>
    <div id="timer"><div id="timer-fill"></div></div>
  </div>
  <div id="fade"></div>
  <div id="act" hidden>
    <h2 id="act-title" aria-label="Act 1"></h2>
    <div id="act-rule"></div>
  </div>
  <div id="end" hidden style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;background:var(--void)">
    <h2 id="end-title">TO BE CONTINUED</h2>
    <div id="replay" class="hint">CLICK TO REPLAY</div>
  </div>
</div>

<script>
(() => {
  // ---- who is watching: the profile name from the V-Devil site ----
  function profileName() {
    try {
      const q = new URLSearchParams(location.search).get("name");
      if (q && q.trim()) return q.trim().slice(0, 15);
    } catch (_) {}
    try {
      const s = localStorage.getItem("vdevil.session");
      const all = JSON.parse(localStorage.getItem("vdevil.accounts") || "{}");
      if (s && all[s] && all[s].username) return all[s].username;
      if (s && !s.includes("@")) return s; // older sessions kept the username itself
    } catch (_) {}
    return "Player";
  }
  const NAME = profileName();

  // Voice line timings (seconds), measured from the pauses in the Itachi recording.
  const LINES = [
    { t0: 0.47, t1: 2.19, text: "You passed the test great......" },
    { t0: 2.41, t1: 4.79, text: "You now into the new story Of this game" },
    { t0: 5.19, t1: 6.29, text: "prepare to see the...." },
    { t0: 6.72, t1: 8.06, text: "Fate of a young boy...." },
    // "Mister" is spoken; the profile name types right after it
    { t0: 8.50, t1: 9.12 + Math.max(0.5, NAME.length * 0.08), text: "Mister " + NAME, name: NAME },
  ];
  const STORY_END = LINES[4].t1 + 0.9;
  const AUTO_WAIT = 10;

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), sub = $("sub"), startEl = $("start");
  const prompt = $("prompt"), timerFill = $("timer-fill");
  const fade = $("fade"), act = $("act");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const VOICE_DIR = "art/";
  const VER = "?v=20261103b";   // new number on each update so phones don't keep an old copy
  const voice = new Audio(VOICE_DIR + "itachi_intro.mp3" + VER);
  voice.preload = "auto";
  voice.setAttribute("playsinline", "");
  let voiceOK = true;
  voice.addEventListener("error", () => { voiceOK = false; });

  // Names with their own recording: Itachi's line with the name already spoken after "Mister".
  const slug = NAME.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  let bakedName = false;
  if (slug) {
    fetch(VOICE_DIR + "voices/" + slug + ".mp3", { method: "HEAD" }).then(r => {
      if (r.ok && state === "idle") { voice.src = VOICE_DIR + "voices/" + slug + ".mp3" + VER; voice.load(); bakedName = true; }
    }).catch(() => {});
  }

  // ---- 16-bit sound chip ----
  let ac = null;
  function chip() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function beep(freq, dur, type = "square", vol = 0.04, when = 0) {
    const a = chip(); if (!a) return;
    const t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // Only Itachi speaks: a name is heard when it has its own Itachi recording (voices/<name>.mp3).
  // Any other name appears in the subtitle only.


  // ===== ACT 1: narration (Fish Audio Itachi), one scene per line =====
  const ACT1_DIR = VOICE_DIR + "act1/";
  const SCENES = [
    // one screen per line; a line can hold several spoken parts, each typed while it is said
    { bg: "black",  parts: [[0.00, 1.32, "Five months ago."], [1.97, 2.97, "It was summer."]], date: "17 JULY 2026 - 20 JULY 2026" },
    { bg: "portal", fadeIn: 10, parts: [[3.33, 8.12, "A portal had torn open the sky and thrown them into the heart of the Sahara"]], fx: "shake", rumble: true },
    { bg: "video",  parts: [[8.70, 11.88, "There, three evil villains were waiting for them"]] },
    { bg: "battle", parts: [[12.35, 13.80, "The battle was long."], [13.95, 14.54, "Brutal."], [14.69, 16.78, "The sand burned under their feet"]], fx: "pan" },
    { bg: "black",  parts: [[16.91, 17.85, "But they won"]], slowFade: true },
    { bg: "black",  parts: [[18.21, 24.52, "When the dust finally settled at the foot of the pyramids, there was only one feeling left: relief."]] },
  ];
  // each screen has its own clip cut from the narration (clip, where it starts in the full recording),
  // so a line always stops at its last word and never runs into the next sentence
  [["line1.mp3", 0], ["line2.mp3", 3.10], ["line3.mp3", 8.30], ["line4.mp3", 12.05], ["line5.mp3", 16.75], ["line6.mp3", 18.20]]
    .forEach(([clip, at], i) => { SCENES[i].clip = clip; SCENES[i].clipAt = at; });
  SCENES.forEach(sc => { sc.seg = [sc.parts[0][0], sc.parts[sc.parts.length - 1][1]]; sc.text = sc.parts.map(q => q[2]).join(" "); });
  const SCENE_WAIT = 30;   // seconds before the story moves on by itself
  const narr = new Audio(ACT1_DIR + "line1.mp3" + VER);
  narr.preload = "auto"; narr.setAttribute("playsinline", "");
  let narrOK = true;
  narr.addEventListener("error", () => { narrOK = false; });
  const scene = $("scene"), scImg = $("sc-img"), scVid = $("sc-vid"), scPx = $("sc-px"), dateEl = $("date"), cut = $("cut");
  const IMGS = { portal: ACT1_DIR + "portal.jpg" + VER, battle: ACT1_DIR + "battle.jpg" + VER };
  Object.values(IMGS).forEach(src => { const im = new Image(); im.src = src; });
  scVid.src = ACT1_DIR + "villains.mp4" + VER;
  scVid.volume = 0.5;

  let si = -1, sceneClock = 0, sceneWaitStart = 0, lineDone = false, dateDone = true, vidDone = true, dateTimer = 0;

  function keyClick() { // typewriter key: a short filtered noise tick
    const a = chip(); if (!a) return;
    const len = Math.floor(a.sampleRate * 0.03), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = "bandpass"; f.frequency.value = 2400 + Math.random() * 600; g.gain.value = 0.35;
    src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
  }

  function rumble(sec) { // portal tremor: low filtered noise with a slow wobble
    const a = chip(); if (!a) return;
    const len = Math.floor(a.sampleRate * sec), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = last * 0.96 + (Math.random() * 2 - 1) * 0.04; d[i] = last * 6; }
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    f.type = "lowpass"; f.frequency.value = 160;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.9, t + 0.08);
    g.gain.setValueAtTime(0.9, t + 0.6);
    g.gain.exponentialRampToValueAtTime(0.25, t + 1.2);
    g.gain.setValueAtTime(0.25, t + sec - 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sec);
    src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + sec);
    beep(55, 0.6, "sawtooth", 0.08); beep(41, 0.9, "square", 0.05, 0.05);
    try { navigator.vibrate && navigator.vibrate([280, 80, 200, 80, 400]); } catch (_) {}
  }

  function unlockAct1Media() { // phones: media that will play later must first play inside a tap
    try { narr.muted = true; const p = narr.play(); if (p && p.then) p.then(() => { narr.pause(); narr.muted = false; }).catch(() => { narr.muted = false; }); } catch (_) {}
    try { scVid.muted = true; const p = scVid.play(); if (p && p.then) p.then(() => { scVid.pause(); scVid.currentTime = 0; scVid.muted = false; }).catch(() => { scVid.muted = false; }); } catch (_) {}
  }

  function blackCut(ms, mid) { // stepped fade to black, swap, fade back
    cut.style.transition = "opacity " + ms + "ms steps(" + Math.max(2, Math.round(ms / 100)) + ")";
    cut.style.opacity = "1";
    setTimeout(() => { mid(); requestAnimationFrame(() => { cut.style.opacity = "0"; }); }, reduce ? 0 : ms);
  }

  function startAct1() {
    state = "act1";
    act.hidden = true;
    $("act-rule").classList.remove("in");
    fade.classList.remove("on");
    scene.hidden = false;
    si = -1;
    nextScene();
  }

  function nextScene() {
    clearTimeout(fadeTimer);
    narr.pause();
    sub.classList.remove("waiting");
    if (si + 1 >= SCENES.length) return endDemo();
    const prev = SCENES[si], sc = SCENES[si + 1];
    const swap = () => { si++; setupScene(sc); };
    state = "act1-cut";
    if (si < 0) swap();
    else blackCut(sc.slowFade ? 1200 : (prev.bg === sc.bg && sc.bg === "black" ? 200 : 450), swap);
  }

  function setupScene(sc) {
    clearInterval(dateTimer);
    sub.innerHTML = ""; shown = "";
    dateEl.textContent = ""; dateEl.classList.remove("caret");
    scImg.hidden = true; scImg.className = "";
    scVid.hidden = true; scVid.pause();
    scPx.hidden = true;
    scImg.style.transition = ""; scImg.style.opacity = "";
    if (sc.bg === "portal" || sc.bg === "battle") {
      scImg.src = IMGS[sc.bg]; scImg.hidden = false;
      if (sc.fadeIn && !reduce) { // long fade in from black; the line starts when the picture pops
        scImg.style.opacity = "0";
        void scImg.offsetWidth;
        scImg.style.transition = "opacity " + sc.fadeIn + "s linear";
        scImg.style.opacity = "1";
        sub.innerHTML = ""; shown = "";
        state = "act1-fade";
        fadeTimer = setTimeout(() => popScene(sc), sc.fadeIn * 1000);
        return;
      }
      void scImg.offsetWidth; if (sc.fx) scImg.className = sc.fx;
    }
    vidDone = sc.bg !== "video";
    if (sc.bg === "video") {
      scVid.hidden = false; scVid.currentTime = 0; scVid.muted = false;
      const p = scVid.play();
      if (p && p.catch) p.catch(() => { scVid.muted = true; scVid.play().catch(() => { pixelFreeze(); }); });
    }
    startLine(sc);
  }

  let fadeTimer = 0;
  function popScene(sc) { // end of the fade in: flash, shake, tremor, then the line
    clearTimeout(fadeTimer);
    if (state !== "act1-fade") return;
    scImg.style.transition = ""; scImg.style.opacity = "1";
    void scImg.offsetWidth; if (sc.fx) scImg.className = sc.fx;
    if (sc.rumble) rumble(3.2);
    startLine(sc);
  }

  function startLine(sc) {
    dateDone = !sc.date;
    lineDone = false;
    sceneClock = performance.now();
    if (narrOK) {
      narr.src = ACT1_DIR + sc.clip + VER;
      const p = narr.play(); if (p && p.catch) p.catch(() => { narrOK = false; });
    }
    state = "act1";
  }

  // the clip ends: freeze its last frame as a 16-bit picture (low resolution, few colours, ordered dither)
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function pixelFreeze() {
    if (vidDone) return;
    vidDone = true;
    const c = scPx.getContext("2d", { willReadFrequently: true });
    const steps = reduce ? [256] : [1024, 512, 384, 256];
    let k = 0;
    function draw() {
      const w = steps[k], h = Math.round(w * 9 / 16);
      scPx.width = w; scPx.height = h;
      c.imageSmoothingEnabled = true;
      try { c.drawImage(scVid, 0, 0, w, h); } catch (_) {}
      if (w === 256) {
        try {
          const im = c.getImageData(0, 0, w, h), d = im.data, lv = 5; // 5 levels per channel
          for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4, t = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * (255 / lv);
            for (let ch = 0; ch < 3; ch++) d[i + ch] = Math.max(0, Math.min(255, Math.round((d[i + ch] + t) / 255 * (lv - 1)) * (255 / (lv - 1))));
          }
          c.putImageData(im, 0, 0);
        } catch (_) {}
      }
      scPx.hidden = false; scVid.hidden = true;
      if (++k < steps.length) setTimeout(draw, 110);
      else beep(523, 0.08, "square", 0.04);
    }
    draw();
  }
  scVid.addEventListener("ended", pixelFreeze);
  scVid.addEventListener("error", () => { vidDone = true; });

  function typeDate(text) {
    let i = 0;
    dateEl.classList.add("caret");
    dateTimer = setInterval(() => {
      i++;
      dateEl.textContent = text.slice(0, i);
      if (text[i - 1] && text[i - 1] !== " ") keyClick();
      if (i >= text.length) { clearInterval(dateTimer); dateDone = true; setTimeout(() => dateEl.classList.remove("caret"), 900); }
    }, 85);
  }

  function sceneTime(sc) {
    if (narrOK && !narr.paused && narr.currentTime > 0) return sc.clipAt + narr.currentTime;
    if (narrOK && narr.ended) return sc.seg[1] + 1;
    return sc.seg[0] + (performance.now() - sceneClock) / 1000;
  }

  function tickScene(now) {
    const sc = SCENES[si];
    if (!lineDone) {
      const t = sceneTime(sc);
      const typed = [];
      for (const [a, b, txt] of sc.parts) {
        if (t < a) break;
        const k = Math.max(0, Math.min(1, (t - a) / (b - a)));
        typed.push(txt.slice(0, Math.floor(txt.length * k)));
      }
      const html = esc(typed.join(" "));
      if (html !== shown) { shown = html; sub.innerHTML = html; }
      if (t >= sc.seg[1] && (!narrOK || narr.ended || narr.paused || t >= sc.seg[1] + 1.5)) {
        lineDone = true;
        sub.innerHTML = esc(sc.text); shown = sub.innerHTML;
        if (sc.date) typeDate(sc.date);
      }
    } else if (dateDone && vidDone) {
      if (!sub.classList.contains("waiting")) { sub.classList.add("waiting"); sceneWaitStart = now; }
      else if (now - sceneWaitStart >= SCENE_WAIT * 1000) nextScene();
    }
  }

  function endDemo() {
    state = "end";
    blackCut(900, () => {
      scene.hidden = true; scVid.pause();
      sub.innerHTML = ""; shown = "";
      $("end").hidden = false;
      beep(659, 0.2, "triangle", 0.06); beep(523, 0.4, "triangle", 0.06, 0.2);
      setTimeout(() => $("replay").classList.add("in"), 2500);
    });
  }

  // states: idle (waiting for a tap) -> story -> wait -> fading -> act -> act1 scenes -> end
  let state = "idle", startClock = 0, waitStart = 0, shown = "";

  function storyTime() {
    if (voiceOK && voice.currentTime > 0 && !voice.paused) return voice.currentTime;
    if (voiceOK && voice.ended) return Math.max(voice.duration, (performance.now() - startClock) / 1000);
    return (performance.now() - startClock) / 1000;
  }

  function render(t) {
    let line = null;
    for (const l of LINES) if (t >= l.t0) line = l;   // a subtitle stays until the next one starts
    let html = "";
    if (line) {
      const k = Math.max(0, Math.min(1, (t - line.t0) / (line.t1 - line.t0)));
      const n = Math.floor(line.text.length * k);
      const typed = line.text.slice(0, n);
      if (line.name) {
        const cut = line.text.length - line.name.length;
        html = esc(typed.slice(0, cut)) + (n > cut ? '<span class="name">' + esc(typed.slice(cut)) + "</span>" : "");
      } else html = esc(typed);
    }
    if (html !== shown) { shown = html; sub.innerHTML = html; }
  }
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function begin() {
    startEl.hidden = true;
    state = "story";
    shown = ""; sub.innerHTML = "";
    startClock = performance.now();
  }

  function tryStart(fromTap) {
    if (fromTap) { try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (_) {} unlockAct1Media(); }
    voice.currentTime = 0;
    const p = voice.play();
    if (p && p.then) {
      p.then(begin).catch(() => {
        if (fromTap) { voiceOK = false; begin(); }   // no sound at all: still show the story
        else { state = "idle"; startEl.hidden = false; }
      });
    } else begin();
  }

  function enterWait() { state = "wait"; waitStart = performance.now(); prompt.hidden = false; }

  function goToAct() {
    state = "fading";
    voice.pause();
    prompt.hidden = true;
    fade.classList.remove("on"); void fade.offsetWidth; fade.classList.add("on");
    setTimeout(showAct, reduce ? 50 : 1000);
  }

  function showAct() {
    state = "act";
    sub.innerHTML = ""; shown = "";
    act.hidden = false;
    const title = $("act-title");
    title.textContent = "";
    const chars = [..."ACT 1"];
    chars.forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "ch"; s.textContent = ch === " " ? " " : ch;
      s.setAttribute("aria-hidden", "true");
      title.appendChild(s);
      setTimeout(() => {
        s.classList.add("in");
        if (ch !== " ") beep([392, 523, 659, 0, 784][i], 0.16, "square", 0.05);
      }, 350 + i * 180);
    });
    const done = 350 + chars.length * 180;
    setTimeout(() => { $("act-rule").classList.add("in"); beep(1047, 0.5, "triangle", 0.08); beep(784, 0.5, "triangle", 0.06, 0.02); }, done);
    actReadyAt = performance.now() + done + 400;
    setTimeout(() => { if (state === "act") startAct1(); }, done + 2600);
  }
  let actReadyAt = 0;

  function replay() {
    act.hidden = true;
    $("end").hidden = true;
    $("act-rule").classList.remove("in");
    $("replay").classList.remove("in");
    fade.classList.remove("on");
    voiceOK = true;
    tryStart(true);
  }

  function press() {
    chip();
    if (state === "idle") tryStart(true);
    else if (state === "wait") goToAct();
    else if (state === "act" && performance.now() >= actReadyAt) startAct1();
    else if (state === "act1") nextScene();
    else if (state === "act1-fade") popScene(SCENES[si]);
    else if (state === "end" && $("replay").classList.contains("in")) replay();
  }
  stage.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
  addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); press(); }
  });

  function frame(now) {
    if (state === "story") {
      const t = storyTime();
      render(t);
      if (t >= STORY_END) { render(99); enterWait(); }
    } else if (state === "wait") {
      const left = Math.max(0, 1 - (now - waitStart) / 1000 / AUTO_WAIT);
      timerFill.style.width = (Math.ceil(left * 20) * 5) + "%";
      if (left <= 0) goToAct();
    } else if (state === "act1") tickScene(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // One tap starts it: phones need it for both the recording and the spoken name.
  startEl.hidden = false;
})();
</script>
</body>
</html>
