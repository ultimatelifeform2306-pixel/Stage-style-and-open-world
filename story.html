<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Sewi Demo Story</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Press+Start+2P&display=swap">
<style>
/* Layout: one wide 16:9 black screen. Itachi's lines run as movie subtitles at the bottom,
   then a stepped fade and the ACT 1 card in the same black. */
:root {
  --void: #000000;
  --sub: #f4f1ff;        /* subtitle white */
  --sub-edge: #000000;
  --muted: #7d7a99;
  --gold: #ffd25a;       /* ACT title */
  --ember: #8a1408;
  --flame: #e8301c;
  --font-pixel: "Press Start 2P", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--sub);
  font-family: var(--font-pixel);
  display: grid;
  place-items: center;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative;
  width: min(100%, calc((100dvh - 24px) * 16 / 9));
  max-width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  background: var(--void);
  overflow: hidden;
  cursor: pointer;
}

/* movie subtitle */
#sub {
  position: absolute;
  left: 6%; right: 6%; bottom: 9%;
  margin: 0;
  text-align: center;
  font-size: 2.3cqw;
  line-height: 1.8;
  min-height: 1.8em;
  color: var(--sub);
  text-shadow:
    0.25cqw 0 0 var(--sub-edge), -0.25cqw 0 0 var(--sub-edge),
    0 0.25cqw 0 var(--sub-edge), 0 -0.25cqw 0 var(--sub-edge),
    0.3cqw 0.3cqw 0 var(--sub-edge);
  overflow-wrap: anywhere;
}
#sub .name { color: var(--gold); }

.hint {
  position: absolute; left: 0; right: 0;
  text-align: center;
  font-size: 1.4cqw;
  color: var(--muted);
}
#start { top: 50%; transform: translateY(-50%); font-size: 2cqw; color: var(--sub); animation: blink 1s steps(2) infinite; }
#prompt { bottom: 3%; display: flex; flex-direction: column; align-items: center; gap: 1cqw; }
#prompt span { animation: blink 1s steps(2) infinite; }
#timer { width: 18cqw; height: 0.8cqw; background: #1a1a1a; }
#timer-fill { height: 100%; width: 100%; background: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }

/* ACT card */
#fade { position: absolute; inset: 0; background: var(--void); opacity: 0; pointer-events: none; }
#fade.on { animation: fade-out 900ms steps(5) forwards; }
@keyframes fade-out { to { opacity: 1; } }
#act {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3.5cqw;
  background: var(--void);
}
#act-title {
  margin: 0;
  font-size: 9cqw;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: 0.12em;
  text-shadow: 0.7cqw 0.7cqw 0 var(--ember);
  display: flex;
}
#act-title .ch { display: inline-block; min-width: 0.6em; opacity: 0; }
#act-title .ch.in { animation: drop 360ms steps(4) forwards; }
@keyframes drop { from { opacity: 1; transform: translateY(-3cqw); } to { opacity: 1; transform: none; } }
#act-rule { height: 0.6cqw; width: 0; background: var(--flame); box-shadow: 0 0.6cqw 0 var(--ember); transition: width 700ms steps(14); }
#act-rule.in { width: 40cqw; }

/* ---- ACT 1 scenes ---- */
#scene { position: absolute; inset: 0; background: var(--void); overflow: hidden; }
#sc-img, #sc-vid, #sc-px { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
#sc-px { image-rendering: pixelated; image-rendering: crisp-edges; }
#sc-img.shake { animation: rumble 120ms steps(2) infinite, jolt 700ms steps(7) 1; }
@keyframes rumble {
  0% { transform: scale(1.06) translate(0.35%, -0.25%); }
  50% { transform: scale(1.06) translate(-0.35%, 0.3%); }
  100% { transform: scale(1.06) translate(0.2%, 0.35%); }
}
@keyframes jolt { 0% { filter: brightness(2.2); } 100% { filter: none; } }
#sc-img.pan { object-position: 50% 0%; animation: pan 14s linear forwards; }
@keyframes pan { to { object-position: 50% 78%; } }
#date {
  position: absolute; left: 0; right: 0; top: 42%;
  text-align: center;
  font-size: 2.6cqw;
  color: var(--gold);
  text-shadow: 0.3cqw 0.3cqw 0 var(--ember);
  letter-spacing: 0.06em;
}
#date.caret::after { content: "_"; animation: blink 0.6s steps(2) infinite; }
#sub.waiting { animation: tap-me 1.4s steps(3) infinite; }
@keyframes tap-me { 50% { opacity: 0.45; } }
#cut { position: absolute; inset: 0; background: var(--void); opacity: 0; pointer-events: none; }
#sc-img.view { transition: transform 1.3s ease-in-out, filter 1.3s ease-in-out; }
#sc-img.view.slow { transition: transform 6.5s ease-in-out, filter 6.5s ease-in-out; }

/* ---- ACT II card ---- */
#act2 {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3.2cqw;
  background: var(--void);
}
#a2-title { margin: 0; font-weight: 400; display: flex; flex-direction: column; align-items: center; gap: 2.2cqw; opacity: 0; }
#a2-title .big { font-size: 9cqw; color: var(--flame); letter-spacing: 0.12em; text-shadow: 0.7cqw 0.7cqw 0 var(--ember); }
#a2-title .rule { width: 40cqw; height: 0.6cqw; background: var(--flame); box-shadow: 0 0.6cqw 0 var(--ember); }
#a2-title .name { font-size: 3.2cqw; color: var(--flame); letter-spacing: 0.1em; text-shadow: 0.35cqw 0.35cqw 0 var(--ember); }
#a2-title.slam { opacity: 1; animation: slam 280ms steps(5) both, creep 7s linear 280ms forwards; }
@keyframes slam { from { transform: scale(2.8); } to { transform: scale(1); } }
@keyframes creep { from { transform: scale(1); } to { transform: scale(1.06); } }
#act2.flash { animation: red-flash 360ms steps(3) 1; }
@keyframes red-flash { 0% { background: #5a0a04; } 100% { background: var(--void); } }
#stage.quake { animation: quake 420ms steps(6) 1; }
@keyframes quake {
  0% { transform: translate(1.2%, -0.8%); } 25% { transform: translate(-1%, 0.9%); }
  50% { transform: translate(0.8%, 0.6%); } 75% { transform: translate(-0.5%, -0.4%); } 100% { transform: none; }
}
#a2-date { font-size: 2.6cqw; color: var(--flame); letter-spacing: 0.06em; text-shadow: 0.3cqw 0.3cqw 0 var(--ember); min-height: 1.2em; }
#a2-date.caret::after { content: "_"; animation: blink 0.6s steps(2) infinite; }

/* ---- ACT II, part 1: April to August ---- */
#sc-img2 { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; }
#tint { position: absolute; inset: 0; background: #ff1a0a; mix-blend-mode: multiply; opacity: 0; pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#date.red { color: var(--flame); text-shadow: 0.3cqw 0.3cqw 0 var(--ember); }

/* ---- ACT II, part 2: September, KENOS RISE ---- */
#rise {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  text-align: center; margin: 0;
  font-family: "Black Ops One", "Impact", "Arial Black", sans-serif; font-weight: 400;
  font-size: 8.5cqw; letter-spacing: 0.06em;
  color: var(--gold); text-shadow: 0.5cqw 0.5cqw 0 var(--ember), 0 0 2cqw rgba(232,48,28,.45);
}
#rise.caret::after { content: "_"; font-family: var(--font-pixel); font-size: 4cqw; animation: blink 0.6s steps(2) infinite; }
#train { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
#bubbles { position: absolute; right: 4%; top: 8%; width: 42%; display: flex; flex-direction: column; align-items: flex-end; gap: 1.4cqw; pointer-events: none; }
.bubble {
  max-width: 100%; padding: 1.1cqw 1.5cqw; border-radius: 1.6cqw 1.6cqw 0.3cqw 1.6cqw;
  background: #2f7cf6; color: #fff; font-family: var(--font-pixel); font-size: 1.45cqw; line-height: 1.6;
  box-shadow: 0.35cqw 0.35cqw 0 rgba(0,0,0,.55); animation: pop 220ms steps(4) both;
}
.bubble small { display: block; font-size: 0.9cqw; opacity: .75; margin-top: 0.4cqw; }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
/* the mask picture: tall, shown whole over a blurred copy, the camera moves inside it */
#mwin { position: absolute; top: 0; left: 50%; height: 100%; aspect-ratio: 2 / 3; transform: translateX(-50%); overflow: hidden; opacity: 0; box-shadow: 0 0 0 0.35cqw #000, 0 0 3cqw rgba(0,0,0,.6); }
#mwin img { position: absolute; max-width: none; display: block; }
#sc-img.backdrop { filter: blur(2.2cqw) brightness(0.55) saturate(1.2); transform: scale(1.15); }
/* ---- ACT II, part 3: 27 September - 2 October ---- */
#sc-img.shock { animation: shock-zoom 220ms steps(4) both, shock-shake 520ms steps(8) 220ms; }
@keyframes shock-zoom { from { transform: scale(1.45); filter: brightness(1.9) contrast(1.3); } to { transform: scale(1.04); filter: none; } }
@keyframes shock-shake {
  0% { transform: scale(1.04) translate(1.6%, -1%); } 25% { transform: scale(1.04) translate(-1.4%, 1.2%); }
  50% { transform: scale(1.04) translate(1%, 0.8%); } 75% { transform: scale(1.04) translate(-0.6%, -0.6%); } 100% { transform: scale(1.04); }
}
#m1.bounce { animation: bounce-in 620ms ease-out both; }
@keyframes bounce-in {
  0% { transform: scale(0.55); opacity: 0; filter: brightness(2); } 45% { transform: scale(1.14); opacity: 1; }
  65% { transform: scale(0.94) translateX(-2%); } 82% { transform: scale(1.03) translateX(1.5%); } 100% { transform: scale(1); filter: none; }
}
#scene.tvoff { animation: tv-off 650ms ease-in forwards; }
@keyframes tv-off {
  0% { transform: none; filter: none; }
  40% { transform: scaleY(0.012) scaleX(1); filter: brightness(3); }
  75% { transform: scaleY(0.012) scaleX(0.02); filter: brightness(4); }
  100% { transform: scaleY(0) scaleX(0); filter: brightness(4); }
}
#sc-img.blurin { animation: blurin 450ms ease-out both; }
@keyframes blurin { from { filter: blur(1.6cqw) brightness(1.6); transform: scale(1.25) translateX(6%); } to { filter: none; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  #a2-title.slam, #act2.flash, #stage.quake { animation: none; }
  #sc-img.shake, #sc-img.pan, #sub.waiting { animation: none; }
  #start, #prompt span, #act-title .ch.in { animation: none; }
  #act-title .ch.in { opacity: 1; }
  #fade.on { animation-duration: 1ms; }
}
</style>
</head>
<body>
<div id="stage" role="application" aria-label="Demo story. Click or press Space to continue.">
  <div id="scene" hidden>
    <img id="sc-img" alt="" hidden>
    <video id="sc-vid" playsinline preload="auto" hidden></video>
    <canvas id="sc-px" width="256" height="144" hidden></canvas>
    <img id="sc-img2" alt="" hidden>
    <canvas id="train" width="688" height="384" hidden></canvas>
    <div id="bubbles" aria-live="polite"></div>
    <h2 id="rise" aria-live="polite"></h2>
    <div id="mwin" hidden><img id="m1" alt=""></div>
    <div id="tint"></div>
    <div id="flash"></div>
    <div id="date" aria-live="polite"></div>
  </div>
  <div id="cut"></div>
  <div id="act2" hidden>
    <h2 id="a2-title" aria-label="Act II — The Last Period">
      <span class="big" aria-hidden="true">ACT II</span>
      <span class="rule" aria-hidden="true"></span>
      <span class="name" aria-hidden="true">THE LAST PERIOD</span>
    </h2>
    <div id="a2-date" aria-live="polite"></div>
  </div>
  <p id="sub" aria-live="polite"></p>
  <div id="start" class="hint" hidden>&#9654; TAP TO START</div>
  <div id="prompt" class="hint" hidden>
    <span>CLICK TO CONTINUE</span>
    <div id="timer"><div id="timer-fill"></div></div>
  </div>
  <div id="fade"></div>
  <div id="act" hidden>
    <h2 id="act-title" aria-label="Act 1"></h2>
    <div id="act-rule"></div>
  </div>
</div>

<script>
(() => {
  // ---- who is watching: the profile name from the V-Devil site ----
  function profileName() {
    try {
      const q = new URLSearchParams(location.search).get("name");
      if (q && q.trim()) return q.trim().slice(0, 15);
    } catch (_) {}
    try {
      const s = localStorage.getItem("vdevil.session");
      const all = JSON.parse(localStorage.getItem("vdevil.accounts") || "{}");
      if (s && all[s] && all[s].username) return all[s].username;
      if (s && !s.includes("@")) return s; // older sessions kept the username itself
    } catch (_) {}
    return "Player";
  }
  const NAME = profileName();

  // Voice line timings (seconds), measured from the pauses in the Itachi recording.
  const LINES = [
    { t0: 0.47, t1: 2.19, text: "You passed the test great......" },
    { t0: 2.41, t1: 4.79, text: "You now into the new story Of this game" },
    { t0: 5.19, t1: 6.29, text: "prepare to see the...." },
    { t0: 6.72, t1: 8.06, text: "Fate of a young boy...." },
    // "Mister" is spoken; the profile name types right after it
    { t0: 8.50, t1: 9.12 + Math.max(0.5, NAME.length * 0.08), text: "Mister " + NAME, name: NAME },
  ];
  const STORY_END = LINES[4].t1 + 0.9;
  const AUTO_WAIT = 10;

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), sub = $("sub"), startEl = $("start");
  const prompt = $("prompt"), timerFill = $("timer-fill");
  const fade = $("fade"), act = $("act");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const VOICE_DIR = "art/";
  const VER = "?v=20261108a";   // new number on each update so phones don't keep an old copy
  let introSrc = VOICE_DIR + "itachi_intro.mp3" + VER;
  const voice = new Audio(introSrc);
  voice.dataset.clip = "intro";
  voice.preload = "auto";
  voice.setAttribute("playsinline", "");
  let voiceOK = true;
  voice.addEventListener("error", () => { voiceOK = false; });

  // Names with their own recording: Itachi's line with the name already spoken after "Mister".
  const slug = NAME.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  let bakedName = false;
  if (slug) {
    fetch(VOICE_DIR + "voices/" + slug + ".mp3", { method: "HEAD" }).then(r => {
      if (r.ok && state === "idle") { introSrc = VOICE_DIR + "voices/" + slug + ".mp3" + VER; voice.src = introSrc; voice.load(); bakedName = true; }
    }).catch(() => {});
  }

  // ---- 16-bit sound chip ----
  let ac = null;
  function chip() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function beep(freq, dur, type = "square", vol = 0.04, when = 0) {
    const a = chip(); if (!a) return;
    const t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // Only Itachi speaks: a name is heard when it has its own Itachi recording (voices/<name>.mp3).
  // Any other name appears in the subtitle only.


  // ===== ACT 1: narration (Fish Audio Itachi), one scene per line =====
  const ACT1_DIR = VOICE_DIR + "act1/";
  const SCENES = [
    // one screen per line; a line can hold several spoken parts, each typed while it is said
    { bg: "black",  parts: [[0.00, 1.32, "Five months ago."], [1.97, 2.97, "It was summer."]], date: "17 JULY 2026 - 20 JULY 2026" },
    { bg: "portal", fadeIn: 10, parts: [[3.33, 8.12, "A portal had torn open the sky and thrown them into the heart of the Sahara"]], fx: "shake", rumble: true },
    { bg: "video",  parts: [[8.70, 11.88, "There, three evil villains were waiting for them"]] },
    { bg: "battle", parts: [[12.35, 13.80, "The battle was long."], [13.95, 14.54, "Brutal."], [14.69, 16.78, "The sand burned under their feet"]], fx: "pan" },
    { bg: "black",  parts: [[16.91, 17.85, "But they won"]], slowFade: true },
    { bg: "black",  parts: [[18.21, 24.52, "When the dust finally settled at the foot of the pyramids, there was only one feeling left: relief."]] },
  ];
  // each screen has its own clip cut from the narration (clip, where it starts in the full recording),
  // so a line always stops at its last word and never runs into the next sentence
  [["line1.mp3", 0], ["line2.mp3", 3.10], ["line3.mp3", 8.30], ["line4.mp3", 12.05], ["line5.mp3", 16.75], ["line6.mp3", 18.20]]
    .forEach(([clip, at], i) => { SCENES[i].clip = clip; SCENES[i].clipAt = at; });
  SCENES.forEach(sc => { sc.seg = [sc.parts[0][0], sc.parts[sc.parts.length - 1][1]]; sc.text = sc.parts.map(q => q[2]).join(" "); });
  const SCENE_WAIT = 30;   // seconds before the story moves on by itself
  // ACT 1 lines play through the same audio player as Itachi's intro: one player only, so a phone
  // never cuts one voice to start another
  const narr = voice;
  let narrOK = true;
  // A skipped line stops its voice while the next one loads: the browser reports that as an
  // "AbortError". That is normal and must not switch the voice off for the rest of the story.
  function voiceFailed(e) { if (e && e.name === "AbortError") return; narrOK = false; }
  ["line1", "line2", "line3", "line4", "line5", "line6"].forEach(n => { // warm the cache so each line starts at once
    try { fetch(ACT1_DIR + n + ".mp3" + VER).catch(() => {}); } catch (_) {}
  });
  const scene = $("scene"), scImg = $("sc-img"), scVid = $("sc-vid"), scPx = $("sc-px"), dateEl = $("date"), cut = $("cut");
  const IMGS = { portal: ACT1_DIR + "portal.jpg" + VER, battle: ACT1_DIR + "battle.jpg" + VER };
  Object.values(IMGS).forEach(src => { const im = new Image(); im.src = src; });
  scVid.src = ACT1_DIR + "villains.mp4" + VER;
  scVid.muted = true; scVid.defaultMuted = true; // the clip stays silent: the narration is the only voice

  let si = -1, sceneClock = 0, sceneWaitStart = 0, lineDone = false, dateDone = true, vidDone = true, dateTimer = 0;

  function keyClick() { // typewriter key: a short filtered noise tick
    const a = chip(); if (!a) return;
    const len = Math.floor(a.sampleRate * 0.03), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = "bandpass"; f.frequency.value = 2400 + Math.random() * 600; g.gain.value = 0.35;
    src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
  }

  function rumble(sec) { // portal tremor: low filtered noise with a slow wobble
    const a = chip(); if (!a) return;
    const len = Math.floor(a.sampleRate * sec), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = last * 0.96 + (Math.random() * 2 - 1) * 0.04; d[i] = last * 6; }
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    f.type = "lowpass"; f.frequency.value = 160;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.9, t + 0.08);
    g.gain.setValueAtTime(0.9, t + 0.6);
    g.gain.exponentialRampToValueAtTime(0.25, t + 1.2);
    g.gain.setValueAtTime(0.25, t + sec - 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sec);
    src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + sec);
    beep(55, 0.6, "sawtooth", 0.08); beep(41, 0.9, "square", 0.05, 0.05);
    try { navigator.vibrate && navigator.vibrate([280, 80, 200, 80, 400]); } catch (_) {}
  }

  function unlockAct1Media() { // phones: media that will play later must first play inside a tap
    // nothing to do any more: the lines share Itachi's player and the clip plays muted
  }

  function blackCut(ms, mid) { // stepped fade to black, swap, fade back
    cut.style.transition = "opacity " + ms + "ms steps(" + Math.max(2, Math.round(ms / 100)) + ")";
    cut.style.opacity = "1";
    setTimeout(() => { mid(); requestAnimationFrame(() => { cut.style.opacity = "0"; }); }, reduce ? 0 : ms);
  }

  function startAct1() {
    state = "act1";
    act.hidden = true;
    $("act-rule").classList.remove("in");
    fade.classList.remove("on");
    scene.hidden = false;
    si = -1;
    nextScene();
  }

  function nextScene() {
    clearTimeout(fadeTimer);
    narr.pause();
    sub.classList.remove("waiting");
    if (si + 1 >= SCENES.length) return endDemo();
    const prev = SCENES[si], sc = SCENES[si + 1];
    const swap = () => { si++; setupScene(sc); };
    state = "act1-cut";
    if (si < 0) swap();
    else blackCut(sc.slowFade ? 1200 : (prev.bg === sc.bg && sc.bg === "black" ? 200 : 450), swap);
  }

  function setupScene(sc) {
    clearInterval(dateTimer);
    sub.innerHTML = ""; shown = "";
