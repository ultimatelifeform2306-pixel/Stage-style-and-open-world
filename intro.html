/* One 16:9 widescreen stage. Phones held upright see a "turn your phone" screen.
   Sequence: Kenos fades in -> NEW DANGER / 2025 drop in on top, KENOS punches up at the bottom ->
   the whole board snaps purple, his card slides left, "KANEL GANG PRODUCTION" lands on the right. */
:root {
  --void: #000;
  --ink: #ffffff;
  --muted: #8a87a8;
  --navy: #1c1a86;        /* NEW DANGER fill */
  --navy-deep: #0a0a3c;   /* its outer shadow */
  --violet: #8b2cf5;      /* KENOS */
  --violet-glow: #b06bff;
  --purple: #5b17c2;
  --purple-deep: #1e0650;
  --font-title: "Bungee", "Arial Black", Impact, sans-serif;
  --font-ui: "Press Start 2P", "Courier New", monospace;
  color-scheme: dark;
}
#stage { --u: min(1cqw, 1.7778cqh); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage {
  /* fills the whole screen, whatever its shape; sizes use --u so nothing gets cut */
  position: fixed; inset: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  container-type: size;
  background: var(--void);
  overflow: hidden; cursor: pointer;
}

/* ---- turn-your-phone screen ---- */
#rotate {
  display: none; position: fixed; inset: 0; z-index: 20;
  background: var(--void);
  flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  padding: 16px; text-align: center; font-size: 12px; line-height: 2;
}
#rotate .phone { width: 54px; height: 92px; border: 4px solid var(--ink); border-radius: 9px; position: relative; animation: turn 2.4s ease-in-out infinite; }
#rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 12px; height: 4px; margin-left: -6px; border-radius: 2px; background: var(--ink); }
#rotate b { color: var(--violet-glow); font-weight: 400; }
#rotate small { color: var(--muted); font-size: 9px; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 1024px) {
  #rotate { display: flex; }
  #stage { visibility: hidden; }
}

}
#bg.in { opacity: 1; }
.tint { position: absolute; inset: 0; background: var(--purple); mix-blend-mode: color; opacity: 0; pointer-events: none; transition: opacity 120ms; }
#hero-tint {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
}
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(0,0,0,.7) 100%); }

/* ---- his card: picture + title + name move together ---- */
#card {
  position: absolute; top: 50%;
  left: 50%; height: min(100cqh, 48cqw); aspect-ratio: 1024 / 1040;
  transform: translate(-50%, -50%);
  transition: left 700ms cubic-bezier(.7,0,.2,1);
}
#card.left { left: calc(min(49cqh, 23.6cqw) + 3cqw); }
#hero {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
  opacity: 0;
}
#hero.in { animation: hero-in 1.8s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes hero-in { from { opacity: 0; transform: scale(1.18); filter: brightness(0) blur(calc(0.6 * var(--u))); } to { opacity: 1; transform: none; filter: none; } }
#hero.purple { filter: saturate(0.6) contrast(1.1); }

/* wind swirl over the head, like the reference */
#swirl { position: absolute; left: 36%; top: 22.5%; width: 28%; overflow: visible; }
#swirl path { fill: none; stroke: #fff; stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; opacity: .9; }
#swirl.in path { animation: draw 700ms ease-out forwards; }
#swirl.in path:nth-child(2) { animation-delay: 90ms; }
#swirl.in path:nth-child(3) { animation-delay: 180ms; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* NEW DANGER / 2025 */
.ttl {
  position: absolute; left: 0; right: 0; margin: 0;
  text-align: center; font-family: var(--font-title); font-weight: 400;
  line-height: 1; letter-spacing: 0.02em;
  color: var(--navy);
  -webkit-text-stroke: calc(0.55 * var(--u)) #fff; paint-order: stroke fill;
  text-shadow: calc(0.35 * var(--u)) calc(0.45 * var(--u)) 0 var(--navy-deep), calc(0.6 * var(--u)) calc(0.75 * var(--u)) 0 rgba(0,0,0,.55);
}
#t1 { top: 3.2%; font-size: calc(5.4 * var(--u)); display: flex; justify-content: center; }
#t1 .ch { display: inline-block; opacity: 0; white-space: pre; }
#t1 .ch.in { animation: drop 420ms cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes drop { from { opacity: 0; transform: translateY(-160%) rotate(-10deg); } to { opacity: 1; transform: none; } }
#t2 { top: 13%; font-size: calc(5.4 * var(--u)); opacity: 0; }
#t2.in { animation: slam 380ms cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes slam { 0% { opacity: 0; transform: scale(3.5); filter: blur(calc(0.4 * var(--u))); } 100% { opacity: 1; transform: none; filter: none; } }

/* KENOS */
#name {
  position: absolute; left: 0; right: 0; bottom: 2.5%; margin: 0;
  text-align: center; font-family: var(--font-title); font-weight: 400;
  font-size: calc(7.6 * var(--u)); line-height: 1; letter-spacing: 0.02em;
  color: var(--violet);
  -webkit-text-stroke: calc(0.9 * var(--u)) #000; paint-order: stroke fill;
  text-shadow: 0 0 calc(1.6 * var(--u)) rgba(176,107,255,.85), 0 0 calc(3.5 * var(--u)) rgba(139,44,245,.55);
  opacity: 0;
}
#name.in { animation: punch 520ms cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes punch { 0% { opacity: 0; transform: translateY(120%) scale(.6); } 100% { opacity: 1; transform: none; } }
#name.pulse { opacity: 1; animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { text-shadow: 0 0 calc(2.6 * var(--u)) rgba(200,150,255,1), 0 0 calc(5 * var(--u)) rgba(139,44,245,.8); } }

/* ---- the purple hit ---- */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.hit { background: #d6b8ff; animation: flash 500ms ease-out forwards; }
#flash.white { animation: flash 220ms ease-out forwards; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
#stage.purple #bg { filter: blur(calc(2.2 * var(--u))) brightness(0.55); }
#stage.purple .tint { opacity: .8; }
#stage.purple #vignette { background: radial-gradient(ellipse at 70% 50%, rgba(90,23,194,.15) 30%, rgba(30,6,80,.85) 100%); }
.shake { animation: quake 360ms linear 1; }
@keyframes quake {
  0% { transform: translate(1%, -0.8%); } 20% { transform: translate(-1.1%, 0.7%); } 40% { transform: translate(0.8%, 0.9%); }
  60% { transform: translate(-0.6%, -0.6%); } 80% { transform: translate(0.3%, 0.3%); } 100% { transform: none; }
}

/* ---- right side credit ---- */
#credit {
  position: absolute; right: max(5%, calc(env(safe-area-inset-right, 0px) + 3%)); top: 50%; width: 36%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end; gap: calc(1.4 * var(--u));
  text-align: right; pointer-events: none;
}
#credit .gang {
  font-family: var(--font-title); font-size: calc(6.6 * var(--u)); line-height: 1.02;
  color: #fff;
  -webkit-text-stroke: calc(0.6 * var(--u)) var(--purple-deep); paint-order: stroke fill;
  text-shadow: calc(0.5 * var(--u)) calc(0.6 * var(--u)) 0 var(--purple-deep);
  transform: translateX(160%);
}
#credit .rule { height: calc(0.45 * var(--u)); width: 0; background: #fff; box-shadow: 0 0 calc(1.2 * var(--u)) var(--violet-glow); transition: width 500ms ease-out; }
#credit .prod { font-size: calc(1.9 * var(--u)); letter-spacing: 0.32em; margin-right: -0.32em; color: #e6d4ff; min-height: 1.2em; }
#credit.in .gang { animation: swipe 520ms cubic-bezier(.2,1.3,.4,1) forwards; }
#credit.in .rule { width: 100%; }
@keyframes swipe { to { transform: none; } }

/* ---- hints ---- */
.hint { position: absolute; left: 0; right: 0; margin: 0; text-align: center; color: #fff; animation: blink 1s steps(2) infinite; }
#start { top: 50%; transform: translateY(-50%); font-size: calc(1.8 * var(--u)); }
#replay { bottom: 3%; right: max(5%, calc(env(safe-area-inset-right, 0px) + 3%)); left: auto; font-size: calc(1.1 * var(--u)); color: #e6d4ff; }
@keyframes blink { 50% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { .shake, #name.pulse { animation: none; } }
</style>

</div>

<main id="stage" aria-label="Kenos, New Danger 2025, a Kanel Gang production">

  <div class="tint" id="bg-tint"></div>

  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise({ dur = 0.3, vol = 0.25, from = 4000, to = 300 } = {}) {
  if (!ac) return;
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  s.buffer = buf; f.type = "bandpass"; f.Q.value = 0.8;
  f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sfx = {
  riser: () => { tone({ type: "sawtooth", f0: 60, f1: 240, dur: 1.8, vol: 0.06 }); noise({ dur: 1.8, vol: 0.08, from: 300, to: 3000 }); },
  whoosh: () => noise({ dur: 0.25, vol: 0.18, from: 2500, to: 500 }),
  thud: () => { tone({ f0: 120, f1: 45, dur: 0.25, vol: 0.4 }); noise({ dur: 0.08, vol: 0.2, from: 1200, to: 200 }); },
  slam: () => { tone({ f0: 90, f1: 30, dur: 0.6, vol: 0.55 }); noise({ dur: 0.35, vol: 0.35, from: 3000, to: 150 }); },
  boom: () => { tone({ type: "sawtooth", f0: 70, f1: 25, dur: 1.4, vol: 0.3 }); tone({ f0: 55, f1: 30, dur: 1.6, vol: 0.5 }); noise({ dur: 0.9, vol: 0.4, from: 5000, to: 100 }); },
  type: () => tone({ type: "square", f0: 1100, f1: 900, dur: 0.04, vol: 0.04 }),
};

/* ---------- sequence ---------- */
function shake() { stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); }
function flashOnce(kind) { flash.className = ""; void flash.offsetWidth; flash.className = kind; }

function reset() {
  stage.classList.remove("purple", "shake");
  for (const el of [bg, card, hero, swirl, t2, nameEl, credit, flash])
    el.classList.remove("in", "left", "purple", "pulse", "hit", "white");
  prod.textContent = "";
  t1.innerHTML = "";
  for (const ch of "NEW DANGER") {
    const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; t1.append(s);
  }
}

let running = false;
async function play() {
  if (running) return;
  running = true;
  startHint.hidden = true; replayHint.hidden = true;
  reset();
  await wait(300);

  // 1. Kenos comes out of the dark
  sfx.riser();
  bg.classList.add("in");
  hero.classList.add("in");
  await wait(1700);

  // 2. title comes in like the poster: NEW DANGER drops, swirl draws, 2025 slams
  for (const ch of t1.children) {
    ch.classList.add("in");
    if (ch.textContent.trim()) sfx.thud();
    await wait(ch.textContent.trim() ? 85 : 60);
  }
  await wait(250);
  sfx.whoosh(); swirl.classList.add("in");
  await wait(250);
  t2.classList.add("in"); sfx.slam(); shake(); flashOnce("white");
  await wait(700);

  // 3. KENOS punches up from the bottom
  sfx.whoosh();
  nameEl.classList.add("in");
  await wait(350); sfx.slam(); shake();
  await wait(250); nameEl.classList.replace("in", "pulse");
  await wait(1600);

  // 4. suddenly: the board goes purple, credit on the right
  sfx.boom(); flashOnce("hit"); shake();
  stage.classList.add("purple"); hero.classList.add("purple");
  card.classList.add("left");
  await wait(550);
  sfx.whoosh(); credit.classList.add("in");
  await wait(650);
  for (const ch of "PRODUCTION") { prod.textContent += ch; sfx.type(); await wait(75); }

  await wait(1200);
  replayHint.hidden = false;
  running = false;
}

stage.addEventListener("click", () => {
  // on phones: go fullscreen and hold landscape where the browser allows it
  const de = document.documentElement;
  if (!document.fullscreenElement && de.requestFullscreen && matchMedia("(pointer: coarse)").matches) {
    de.requestFullscreen({ navigationUI: "hide" }).then(() => screen.orientation?.lock?.("landscape")).catch(() => {});
  }
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
  play();
});
reset();
</script>
