<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenos New Danger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Press+Start+2P&family=Squada+One&display=swap">
<style>
/* Full-screen intro built on the wide car picture (text removed from it, redrawn live):
   Kenos fades in -> NEW DANGER / 2025 come in like the poster -> KENOS punches up ->
   the whole board snaps purple, the scene slides left, "KANEL GANG PRODUCTION" lands on the right. */
:root {
  --void: #000;
  --ink: #fff;
  --muted: #8a87a8;
  --navy: #231f9c;        /* NEW DANGER fill */
  --navy-deep: #14105a;   /* its 3D shadow */
  --violet: #8a2cff;      /* KENOS */
  --purple: #5b17c2;
  --purple-deep: #1e0650;
  --font-title: "Squada One", "Arial Narrow", Impact, sans-serif;
  --font-name: "Archivo Black", "Arial Black", sans-serif;
  --font-ui: "Press Start 2P", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--ink);
  font-family: var(--font-ui); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  container-type: size;
  background: var(--void);
  overflow: hidden; cursor: pointer;
}

/* ---- turn-your-phone screen ---- */
#rotate {
  display: none; position: fixed; inset: 0; z-index: 20;
  background: var(--void);
  flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  padding: 16px; text-align: center; font-size: 12px; line-height: 2;
}
#rotate .phone { width: 54px; height: 92px; border: 4px solid var(--ink); border-radius: 9px; position: relative; animation: turn 2.4s ease-in-out infinite; }
#rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 12px; height: 4px; margin-left: -6px; border-radius: 2px; background: var(--ink); }
#rotate b { color: #b06bff; font-weight: 400; }
#rotate small { color: var(--muted); font-size: 9px; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 1024px) {
  #rotate { display: flex; }
  #stage { visibility: hidden; }
}

/* ---- the scene: picture + title + name, moves as one ---- */
#scene { position: absolute; inset: 0; transition: transform 750ms cubic-bezier(.7,0,.2,1); }
#scene.left { transform: translateX(-14cqw); }
#pic {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 47% 28%;
  opacity: 0;
}
#pic.in { animation: pic-in 1.8s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes pic-in { from { opacity: 0; transform: scale(1.15); filter: brightness(0) blur(1cqh); } to { opacity: 1; transform: none; filter: none; } }
#tint { position: absolute; inset: 0; background: var(--purple); mix-blend-mode: color; opacity: 0; pointer-events: none; }

/* title block sits over his head, centred on his face (47% across the picture) */
#title {
  position: absolute; left: 47%; top: 2.5cqh;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
  margin: 0; font-weight: 400;
}
.ttl {
  position: relative;
  font-family: var(--font-title); font-size: 13cqh; line-height: 1.02; letter-spacing: 0.03em;
  white-space: nowrap;
  color: var(--navy);
  -webkit-text-stroke: 2.2cqh #fff; paint-order: stroke fill;
  text-shadow: 1cqh 1.1cqh 0 var(--navy-deep), 1.3cqh 1.5cqh 0 rgba(0,0,0,.4);
}
#t1 { display: flex; }
#t1 .ch { display: inline-block; opacity: 0; white-space: pre; }
#t1 .ch.in { animation: drop 420ms cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes drop { from { opacity: 0; transform: translateY(-140%) rotate(-12deg); } to { opacity: 1; transform: none; } }
#t2 { opacity: 0; z-index: 1; }
#t2.in { animation: slam 380ms cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes slam { 0% { opacity: 0; transform: scale(3.4); filter: blur(0.5cqh); } 100% { opacity: 1; transform: none; filter: none; } }

/* wind swirl behind 2025, like the poster */
#swirl { position: absolute; left: -6%; top: 36%; width: 66%; overflow: visible; z-index: 0; }
#swirl path { fill: none; stroke: #fff; stroke-width: 1.1; stroke-linecap: round; stroke-dasharray: 160; stroke-dashoffset: 160; }
#swirl.in path { animation: draw 650ms ease-out forwards; }
#swirl.in path:nth-child(2) { animation-delay: 80ms; }
#swirl.in path:nth-child(3) { animation-delay: 160ms; }
#swirl.in path:nth-child(4) { animation-delay: 240ms; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* KENOS */
#name {
  position: absolute; left: 47%; bottom: 3cqh; margin: 0;
  transform: translateX(-50%);
  font-family: var(--font-name); font-weight: 400; font-size: 13cqh; line-height: 1; letter-spacing: 0.01em;
  color: var(--violet);
  -webkit-text-stroke: 2.6cqh #07040d; paint-order: stroke fill;
  text-shadow: 0 0 2.5cqh #000, 0 0 5cqh rgba(0,0,0,.8);
  opacity: 0;
}
#name.in { animation: punch 520ms cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes punch { 0% { opacity: 0; transform: translate(-50%, 120%) scale(.6); } 100% { opacity: 1; transform: translateX(-50%); } }
#name.pulse { opacity: 1; animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { text-shadow: 0 0 2.5cqh #000, 0 0 6cqh rgba(138,44,255,.95); } }

/* ---- the purple hit ---- */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.hit { background: #d6b8ff; animation: flash 500ms ease-out forwards; }
#flash.white { animation: flash 220ms ease-out forwards; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
#stage.purple #tint { opacity: .78; }
#stage.purple #pic { filter: contrast(1.08); }
#panel {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, transparent 38%, rgba(30,6,80,.75) 58%, var(--purple-deep) 86%);
  transition: opacity 400ms ease;
}
#stage.purple #panel { opacity: 1; }
.shake { animation: quake 360ms linear 1; }
@keyframes quake {
  0% { transform: translate(1%, -0.8%); } 20% { transform: translate(-1.1%, 0.7%); } 40% { transform: translate(0.8%, 0.9%); }
  60% { transform: translate(-0.6%, -0.6%); } 80% { transform: translate(0.3%, 0.3%); } 100% { transform: none; }
}

/* ---- right side credit ---- */
#credit {
  position: absolute; right: max(5cqw, calc(env(safe-area-inset-right, 0px) + 3cqw)); top: 50%; width: 32cqw;
  transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end; gap: 2.4cqh;
  text-align: right; pointer-events: none;
}
#credit .gang {
  font-family: var(--font-name); font-size: min(12cqh, 6.4cqw); line-height: 1.02;
  color: #fff;
  -webkit-text-stroke: 1cqh var(--purple-deep); paint-order: stroke fill;
  text-shadow: 0.8cqh 1cqh 0 #0d0228;
  transform: translateX(170%);
}
#credit .rule { height: 0.8cqh; width: 0; background: #fff; box-shadow: 0 0 2cqh #b06bff; transition: width 500ms ease-out; }
#credit .prod { font-size: min(3.4cqh, 1.8cqw); letter-spacing: 0.32em; margin-right: -0.32em; color: #e6d4ff; min-height: 1.2em; }
#credit.in .gang { animation: swipe 520ms cubic-bezier(.2,1.3,.4,1) forwards; }
#credit.in .rule { width: 100%; }
@keyframes swipe { to { transform: none; } }

/* ---- hints ---- */
.hint { position: absolute; left: 0; right: 0; margin: 0; text-align: center; color: #fff; animation: blink 1s steps(2) infinite; }
#start { top: 50%; transform: translateY(-50%); font-size: min(3.2cqh, 1.8cqw); }
#replay { bottom: 4cqh; right: max(5cqw, calc(env(safe-area-inset-right, 0px) + 3cqw)); left: auto; font-size: min(2.2cqh, 1.1cqw); color: #e6d4ff; }
@keyframes blink { 50% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { .shake, #name.pulse { animation: none; } }
</style>
</head>

</div>

    <div id="tint"></div>
    <h1 id="title" aria-label="New Danger 2025">
      <span class="ttl" id="t1"></span>
      <span class="ttl" id="t2">2025</span>
      <svg id="swirl" viewBox="0 0 100 40" aria-hidden="true">
        <path d="M18 34 C 4 22, 30 6, 62 8 C 80 9, 86 16, 80 22"/>
        <path d="M24 31 C 14 21, 36 11, 60 12 C 74 13, 78 18, 72 22"/>
        <path d="M30 28 C 24 21, 42 15, 58 16 C 68 17, 70 20, 66 23"/>
        <path d="M36 26 C 33 22, 44 19, 55 20"/>
      </svg>
    </h1>
    <p id="name">KENOS</p>
  </div>
  <div id="panel"></div>
  <div id="credit" aria-label="Kanel Gang production">
    <div class="gang">KANEL<br>GANG</div>
    <div class="rule"></div>
    <div class="prod"></div>
  </div>
  <div id="flash"></div>
  <p class="hint" id="start">TAP TO START</p>
  <p class="hint" id="replay" hidden>TAP TO REPLAY</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const stage = $("stage"), scene = $("scene"), pic = $("pic"), swirl = $("swirl"),
      t1 = $("t1"), t2 = $("t2"), nameEl = $("name"), credit = $("credit"), flash = $("flash"),
      prod = credit.querySelector(".prod"), startHint = $("start"), replayHint = $("replay");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- sounds made in Web Audio (no files) ---------- */
let ac = null;
function tone({ type = "sine", f0 = 440, f1 = f0, dur = 0.2, vol = 0.15, at = 0 }) {
  if (!ac) return;
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise({ dur = 0.3, vol = 0.25, from = 4000, to = 300 } = {}) {
  if (!ac) return;
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  s.buffer = buf; f.type = "bandpass"; f.Q.value = 0.8;
  f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sfx = {
  riser: () => { tone({ type: "sawtooth", f0: 60, f1: 240, dur: 1.8, vol: 0.06 }); noise({ dur: 1.8, vol: 0.08, from: 300, to: 3000 }); },
  whoosh: () => noise({ dur: 0.25, vol: 0.18, from: 2500, to: 500 }),
  thud: () => { tone({ f0: 120, f1: 45, dur: 0.25, vol: 0.4 }); noise({ dur: 0.08, vol: 0.2, from: 1200, to: 200 }); },
  slam: () => { tone({ f0: 90, f1: 30, dur: 0.6, vol: 0.55 }); noise({ dur: 0.35, vol: 0.35, from: 3000, to: 150 }); },
  boom: () => { tone({ type: "sawtooth", f0: 70, f1: 25, dur: 1.4, vol: 0.3 }); tone({ f0: 55, f1: 30, dur: 1.6, vol: 0.5 }); noise({ dur: 0.9, vol: 0.4, from: 5000, to: 100 }); },
  type: () => tone({ type: "square", f0: 1100, f1: 900, dur: 0.04, vol: 0.04 }),
};

/* ---------- sequence ---------- */
function shake() { stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); }
function flashOnce(kind) { flash.className = ""; void flash.offsetWidth; flash.className = kind; }

function reset() {
  stage.classList.remove("purple", "shake");
  for (const el of [scene, pic, swirl, t2, nameEl, credit, flash])
    el.classList.remove("in", "left", "pulse", "hit", "white");
  prod.textContent = "";
  t1.innerHTML = "";
  for (const ch of "NEW DANGER") {
    const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; t1.append(s);
  }
}

let running = false;
async function play() {
  if (running) return;
  running = true;
  startHint.hidden = true; replayHint.hidden = true;
  reset();
  await wait(300);

  // 1. Kenos comes out of the dark
  sfx.riser();
  pic.classList.add("in");
  await wait(1800);

  // 2. title like the poster: NEW DANGER drops letter by letter, swirl draws, 2025 slams
  for (const ch of t1.children) {
    ch.classList.add("in");
    if (ch.textContent.trim()) sfx.thud();
    await wait(ch.textContent.trim() ? 85 : 60);
  }
  await wait(250);
  sfx.whoosh(); swirl.classList.add("in");
  await wait(300);
  t2.classList.add("in"); sfx.slam(); shake(); flashOnce("white");
  await wait(700);

  // 3. KENOS punches up from the bottom
  sfx.whoosh();
  nameEl.classList.add("in");
  await wait(350); sfx.slam(); shake();
  await wait(250); nameEl.classList.replace("in", "pulse");
  await wait(1600);

  // 4. suddenly: the board goes purple, credit on the right
  sfx.boom(); flashOnce("hit"); shake();
  stage.classList.add("purple");
  scene.classList.add("left");
  await wait(550);
  sfx.whoosh(); credit.classList.add("in");
  await wait(650);
  for (const ch of "PRODUCTION") { prod.textContent += ch; sfx.type(); await wait(75); }

  await wait(1200);
  replayHint.hidden = false;
  running = false;
}

stage.addEventListener("click", () => {
  // on phones: go fullscreen and hold landscape where the browser allows it
  const de = document.documentElement;
  if (!document.fullscreenElement && de.requestFullscreen && matchMedia("(pointer: coarse)").matches) {
    de.requestFullscreen({ navigationUI: "hide" }).then(() => screen.orientation?.lock?.("landscape")).catch(() => {});
  }
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
  play();
});
reset();
</script>
